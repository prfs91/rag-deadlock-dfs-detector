  <text x="540" y="201" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#7f1d1d">T</text>

  <rect x="665" y="280" width="50" height="50" fill="#fee2e2" stroke="#b91c1c" stroke-width="2.6"/>
