<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 430" width="100%" height="auto" role="img">
  <title>Grafo de Alocação de Recursos - Slide 40 (Detecção por DFS)</title>
  <defs>
    <marker id="seta-normal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
    <marker id="seta-ciclo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect width="780" height="430" fill="#f8fafc" rx="6" stroke="#cbd5e1" stroke-width="1"/>
  <text x="20" y="28" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0f172a">
    Caso T1 (Slide 40): Detecção de Impasse por Busca em Profundidade (Lista L)
  </text>

  <!-- Arcos Fora do Ciclo -->
  <line x1="92" y1="75" x2="184" y2="75" stroke="#475569" stroke-width="2.2" marker-end="url(#seta-normal)"/>
  <line x1="210" y1="101" x2="210" y2="168" stroke="#475569" stroke-width="2.2" marker-end="url(#seta-normal)"/>
  <line x1="96" y1="195" x2="182" y2="195" stroke="#475569" stroke-width="2.2" marker-end="url(#seta-normal)"/>
  <line x1="210" y1="354" x2="210" y2="306" stroke="#475569" stroke-width="2.2" marker-end="url(#seta-normal)"/>
  <line x1="210" y1="254" x2="210" y2="222" stroke="#475569" stroke-width="2.2" marker-end="url(#seta-normal)"/>
  <line x1="354" y1="195" x2="238" y2="195" stroke="#475569" stroke-width="2.2" marker-end="url(#seta-normal)"/>
  <line x1="540" y1="101" x2="540" y2="168" stroke="#475569" stroke-width="2.2" marker-end="url(#seta-normal)"/>

  <!-- Arcos do Ciclo de Impasse (D -> T -> E -> V -> G -> U -> D) -->
  <line x1="406" y1="195" x2="512" y2="195" stroke="#dc2626" stroke-width="3" marker-end="url(#seta-ciclo)"/>
  <line x1="566" y1="195" x2="664" y2="195" stroke="#dc2626" stroke-width="3" marker-end="url(#seta-ciclo)"/>
  <line x1="690" y1="221" x2="690" y2="278" stroke="#dc2626" stroke-width="3" marker-end="url(#seta-ciclo)"/>
  <path d="M 690 330 L 690 380 L 408 380" fill="none" stroke="#dc2626" stroke-width="3" marker-end="url(#seta-ciclo)"/>
  <line x1="380" y1="354" x2="380" y2="308" stroke="#dc2626" stroke-width="3" marker-end="url(#seta-ciclo)"/>
  <line x1="380" y1="254" x2="380" y2="223" stroke="#dc2626" stroke-width="3" marker-end="url(#seta-ciclo)"/>

  <!-- Nós de Recursos (Quadrados) -->
  <rect x="42" y="50" width="50" height="50" fill="#fef3c7" stroke="#b45309" stroke-width="2.2"/>
  <text x="67" y="81" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#78350f">R</text>

  <rect x="185" y="170" width="50" height="50" fill="#fef3c7" stroke="#b45309" stroke-width="2.2"/>
  <text x="210" y="201" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#78350f">S</text>

  <rect x="185" y="355" width="50" height="50" fill="#fef3c7" stroke="#b45309" stroke-width="2.2"/>
  <text x="210" y="386" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#78350f">W</text>

  <!-- Recursos no Ciclo (T, V, U) -->
